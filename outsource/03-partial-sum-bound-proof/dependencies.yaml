theorem_id: ps-bound-sym2-delta
status:
  mathematical: CONJECTURE
  computational: EMPIRICAL
dependencies:
  - id: DEL-D1-ramanujan-bound
    statement: >
      |A(n)| <= d_3(n) for all n >= 1, where d_3 is the 3-divisor function.
    source: >
      Follows from Deligne's bound |tau(p)| <= 2*p^{5.5} and the
      multiplicativity of A(n). Baseline REFERENCE_BASELINE.md entry DEL-D.1.
    mathematical: REFEREED
    peer_reviewed: true
    computational: VERIFIED
    usable_as_premise: true
    role: Provides pointwise bound on |A(n)|; too weak for partial-sum bound
      (gives |S(X)| << X*log(X)^2 instead of X^{1/2}).
  - id: SYM2-DIRICHLET-SERIES
    statement: >
      L(s, sym^2 Delta) = sum A(n)/n^s converges absolutely for Re(s) > 1.
    source: >
      Standard for L-functions of GL_3 automorphic forms; follows from
      |A(n)| <= d_3(n) = O(n^epsilon).
    mathematical: REFEREED
    peer_reviewed: true
    computational: NONE
    usable_as_premise: true
    role: Establishes analytic continuation to Re(s) > 1.
  - id: FUNCTIONAL-EQUATION
    statement: >
      L(s, sym^2 Delta) satisfies a functional equation relating s to 1-s
      with gamma factors Gamma_R(s) * Gamma_C(s+11).
    source: >
      Standard for symmetric square L-functions of cusp forms; follows from
      Gelbart-Jacquet (1978).
    mathematical: REFEREED
    peer_reviewed: true
    computational: NONE
    usable_as_premise: true
    role: Relates zeros in critical strip to values at 1-s.
  - id: EMPIRICAL-PARTIAL-SUM-BOUND
    statement: >
      For X in [1, 20000]: max |S(X)|/X^{0.5} = 0.2590.
    source: >
      Computed in src/zero_free_arb.py using exact A(n) from tau sieve.
    mathematical: EMPIRICAL
    peer_reviewed: false
    computational: DISCOVERY
    usable_as_premise: false
    role: Suggests the correct exponent is 1/2; provides candidate constant C.
gate_a_status: NOT_SUBMITTED
gate_a_note: >
  This is a conjecture with empirical evidence. No proof exists.
  The reviewer is asked to evaluate proposed proof routes, not to verify
  a completed proof.
