theorem_id: ps-bound-sym2-delta
status:
  mathematical: THEOREM
  computational: EMPIRICAL
dependencies:
  - id: DEL-D1-ramanujan-bound
    statement: >
      |A(n)| <= d_3(n) for all n >= 1, where d_3 is the 3-divisor function.
      In particular, |A(p)| <= 3 for all primes p.
    source: >
      The local Satake parameters of sym^2 Delta at p are alpha_p^2, 1,
      beta_p^2 with |alpha_p| = |beta_p| = 1 (Deligne). A(p^r) is the
      degree-r complete homogeneous symmetric polynomial in these three
      unit-modulus parameters — a sum of exactly C(r+2,2) = d_3(p^r)
      unit-modulus terms. Hence |A(p^r)| <= d_3(p^r), and multiplicativity
      gives |A(n)| <= d_3(n). Baseline REFERENCE_BASELINE.md entry DEL-D.1.
    mathematical: REFEREED
    peer_reviewed: true
    computational: VERIFIED
    usable_as_premise: true
    role: Provides pointwise bound on |A(n)|; too weak for partial-sum bound
      (gives |S(X)| << X*log(X)^2 instead of X^{1/2+epsilon}).
  - id: SYM2-DIRICHLET-SERIES
    statement: >
      L(s, sym^2 Delta) = sum A(n)/n^s converges absolutely for Re(s) > 1.
    source: >
      Standard for L-functions of GL_3 automorphic forms; follows from
      |A(n)| <= d_3(n) = O(n^epsilon).
    mathematical: REFEREED
    peer_reviewed: true
    computational: NONE
    usable_as_premise: true
    role: Establishes analytic continuation to Re(s) > 1.
  - id: FUNCTIONAL-EQUATION
    statement: >
      L(s, sym^2 Delta) satisfies a functional equation relating s to 1-s
      with gamma factors Gamma_R(s+1) * Gamma_C(s+11), i.e. archimedean
      parameters (kappa_1, kappa_2, kappa_3) = (1, 11, 12).
    source: >
      Standard for symmetric square L-functions of cusp forms; follows from
      Gelbart-Jacquet (1978), "A relation between automorphic representations
      of GL(2) and GL(3)" (Ann. Sci. ENS 11, 1978), and Iwaniec-Michel,
      "Derivatives of L-functions of symmetric square" (Acta Arith. 2000).
    mathematical: REFEREED
    peer_reviewed: true
    computational: NONE
    usable_as_premise: true
    role: Relates zeros in critical strip to values at 1-s.
  - id: FRIEDLANDER-IWANIEC-SUMMATION
    statement: >
      Friedlander-Iwaniec (2005), Proposition 3.2: For a degree-3 Dirichlet
      series satisfying the Friedlander-Iwaniec hypotheses (functional equation,
      coefficients O_epsilon(n^epsilon), conductor D, and R(X)=0 when entire):
      sum_{n<=X} a(n) = O_epsilon(D^{1/4} X^{1/2+epsilon}).
      Note: the general degree-m Proposition 1.1 gives the weaker exponent
      D^{1/(m+1)} X^{(m-1)/(m+1)+epsilon}; the degree-3 specialization
      (Prop. 3.2) is what this package uses.
    source: >
      J.B. Friedlander and H. Iwaniec, "Summation Formulae for Coefficients
      of L-functions", Canadian J. Math. 57 (2005), 494-505, Prop. 3.2.
    mathematical: REFEREED
    peer_reviewed: true
    computational: NONE
    usable_as_premise: true
    role: Core theorem giving the unconditional partial-sum bound.
  - id: EMPIRICAL-PARTIAL-SUM-BOUND
    statement: >
      For X in [100, N]: max |S(X)|/X^{0.5} = 0.2590 (approximate).
    source: >
      Computed from tau(n) via Euler product; range starts at 100 because
      S(1)/sqrt(1) = 1.
    mathematical: EMPIRICAL
    peer_reviewed: false
    computational: DISCOVERY
    usable_as_premise: false
    role: Suggests the correct exponent is 1/2; provides candidate constant C.
gate_a_status: NOT_SUBMITTED
gate_a_note: >
  Theorem proved unconditionally via Friedlander-Iwaniec Proposition 3.2.
  The explicit constant C(epsilon) is not available from the theorem.
  The empirical value 0.259 is discovery-tier only.
