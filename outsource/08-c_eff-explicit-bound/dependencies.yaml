# What is NOT a dependency (corrected from original)
not_dependencies:
  - id: M-1-MOLLIFIER
    reason: "HL approach uses auxiliary Dirichlet series, not mollifier moment"
  - id: M-2-MEAN-VALUE
    reason: "HL approach doesn't need GL₃ second moment asymptotic"
  - id: F-2-GLOBAL-RESIDUE
    reason: "HL uses ζ·L²·L(Π×Π̃), not Rankin–Selberg residue directly"
  - id: GL3-VORONOI
    reason: "No Kloosterman sums needed in HL approach"
  - id: GL3-VK-GENERAL
    reason: "Existing symmetric-square zero-free results suffice"
  - id: CASE-2-EXCEPTIONAL
    reason: "Prime level + trivial char eliminates GL(1)-lift obstruction"

