    source: "Hoffstein–Lockhart (1994), Annals of Mathematics 140(1), pp. 1–42"
    evidence: "refereed"
    status: "[THM]"
    note: "Theorem 0.1 (main bound) + Proposition 1.1 (zero-free → residue lower bound)"

  - id: GHL-1994
    source: "Goldfeld–Hoffstein–Lieman (1994), appendix to 'Effective estimates for L-functions...'"
    evidence: "refereed"
    status: "[THM]"
    note: "Generic zero-free region via auxiliary series with non-negative coefficients; effective constants"

  - id: IWANIEC-MICHEL-2001
    source: "Iwaniec–Michel (2001), J. Amer. Math. Soc. 14, pp. 705–751"
    evidence: "refereed"
    status: "[THM]"
    note: "Symmetric-square L-functions: archimedean factors, bad-prime normalization, conductor=p²"

  - id: HL-PROPOSITION-1-1
    source: "Hoffstein–Lockhart (1994), Proposition 1.1"
    evidence: "refereed"
    status: "[THM]"
    note: "Non-negative coefficients + zero-free region + growth ⟹ residue ≥ c/log M"
