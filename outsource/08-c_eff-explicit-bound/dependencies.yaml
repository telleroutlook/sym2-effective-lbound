# c_eff Dependencies — v2 (corrected per reviewer feedback)

# Corrected dependency chain
dependency_chain:
  - stage: "A. Normalization"
    status: "[THM]"
    description: "f ∈ S_k^new(Γ₀(p)), F=sym²f, q_ar=p², Λ(s,F)=p^s L_∞(s) L(s,F)"
  - stage: "B. GHL zero-free region"
    status: "[THM, constants OBL]"
    description: "φ(s)=ζ(s)L(s,F)³L(s,F,V²), double pole at s=1, triple-zero contradiction"
  - stage: "C. HL lower bound"
    status: "[THM, constants OBL]"
    description: "Apply HL Prop 1.1 to A(s)=ζ(s)L(s,F), residue=L(1,F), get L(1)≥c₁/log(kp+1)"
  - stage: "D. Numerical constants"
    status: "[OBL]"
    description: "Trace all O(1), ≪, c(B), C; compute c_eff>0 via Arb"

# What is NOT a dependency
not_dependencies:
  - id: M-1-MOLLIFIER
    reason: "HL approach uses auxiliary Dirichlet series, not mollifier moment"
  - id: M-2-MEAN-VALUE
    reason: "HL approach doesn't need GL₃ second moment asymptotic"
  - id: F-2-GLOBAL-RESIDUE
    reason: "HL uses ζ·L²·L(F×F), not Rankin–Selberg residue directly"
  - id: GL3-VORONOI
    reason: "No Kloosterman sums needed in HL approach"
  - id: GL3-VK-GENERAL
    reason: "Existing symmetric-square zero-free results suffice"
  - id: CASE-2-EXCEPTIONAL
    reason: "Prime level + trivial char eliminates GL(1)-lift obstruction"

# Verified dependencies
dependencies:
