# M-1 Dependencies — v4

# Required assumptions
assumptions:
  - id: NON-CM
    description: "π non-CM / non-dihedral, so Π = sym²π is cuspidal GL₃"
    source: "Standard; CM/dihedral gives isobaric decomposition"
    evidence: "textbook"
    status: "[OBL] must be verified for each target form"

  - id: RAMANUJAN-GL2
    description: "GL₂ Ramanujan bound for π (Deligne's theorem)"
    source: "Deligne (1974), Serre (1978)"
    evidence: "refereed"
    status: "[THM] for holomorphic forms"

# Core analytic ingredients
ingredients:
  - id: AFE-GL3
    description: "AFE for L(½+it, Π) with length ≈ T^{3/2} and t-dependent weights V_t"
    source: "Iwaniec–Kowalski (2004), §5.6"
    evidence: "textbook"
    status: "[THM]"

  - id: FE-FACTOR
    description: "X_Π(s) = ε_Π q_Π^{1/2-s} L_∞(1-s,π̃)/L_∞(s,Π); |X_Π(½+it)|=1"
    source: "Standard functional equation for GL₃"
    evidence: "textbook"
    status: "[THM] — normalization corrected v4"

  - id: RECIPROCAL-COEFFICIENTS
    description: "True reciprocal Euler coefficients ρ_Π(n) with (p,p²,p³) three-term structure"
    source: "Standard Euler product theory"
    evidence: "textbook"
    status: "[THM]"

  - id: GL3-TWISTED-MOMENT
    description: "Mollified twisted GL₃ moment: I(T) = C_{Π,θ}T + O(T^{1-δ}), C > 0"
    evidence: "none"
    status: "[OBL] — research frontier"

  - id: CONVOLUTION-COEFFICIENTS
    description: "Weighted bound Σ_{q≈Q} |c_X(q)|²/q ≪ Q^ε for convolution c_X(q) = Σ_{mr=q, m≤X} b_m a_Π(r)"
    evidence: "none"
    status: "[OBL] — note: UNWEIGHTED Σ|c_X(q)|² grows like Q^{1+ε}, not Q^ε"

  - id: FOUR-BLOCK-AFE
    description: "4-block decomposition |M·(A+XB)|² = I_{++}+I_{--}+I_{+-}+I_{-+}"
    evidence: "textbook"
    status: "[OBL] — blocks not individually analyzed"

  - id: CROSS-BLOCK-GAMMA
    description: "Gamma-phase stationary-phase analysis for cross blocks I_{+-}, I_{-+}"
    evidence: "none"
    status: "[OBL] — stationary locus differs from near-diagonal geometry"

# Context (NOT direct dependencies)
context:
  - id: DLY-2024
    description: "Dasgupta–Leung–Young (2024): upper bound T^{4/3+ε} for unmollified GL₃ second moment"
    source: "arXiv:2407.06962"
    evidence: "preprint"
    status: "Upper bound context; NOT a solved asymptotic; NOT identical to fixed-Π t-aspect"

  - id: PAL-2025
    description: "Pal (IMRN 2025): upper bound T^{3/2-3/32+ε} for Hecke–Maaß SL(3,Z) second moment"
    source: "IMRN 2025, doi:10.1093/imrn/rnaf234"
    evidence: "refereed"
    status: "Upper bound context; for Maaß forms, not holomorphic; NOT identical to target problem"

  - id: CKLT2026
    description: "Conrey–Kwan–Lin–Turnage-Butterbaugh (2026): PGL₃ Dirichlet-twist family (arXiv:2607.00282)"
    source: "arXiv:2607.00282"
    evidence: "preprint"
    status: "Adjacent work; averages over character twists, NOT fixed Π t-aspect"

# What is NOT a dependency
not_dependencies:
  - id: SQUAREFREE-APPROX
    description: "Squarefree approximation lemma"
    reason: "Algebraically vacuous in v1; D_X coefficient difference moved to aside in v4"

  - id: GL3-LARGE-SIEVE
    description: "GL₃ spectral large sieve"
    reason: "Applies to families, NOT fixed Π"

  - id: BRIDGE-LEMMA
    description: "Bridge I(T) ≥ c₀T ⟹ L(½,Π) > 0"
    reason: "FALSE: integral at |t| ≥ T₀ cannot detect central value"
