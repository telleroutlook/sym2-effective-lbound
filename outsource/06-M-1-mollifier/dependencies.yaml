# M-1 Dependencies — Rewritten v2

# Required assumptions
assumptions:
  - id: NON-CM
    description: "π non-CM / non-dihedral, so Π = sym²π is cuspidal GL₃"
    source: "Standard; CM/dihedral gives isobaric decomposition"
    evidence: "textbook"
    status: "[OBL] must be verified for each target form"

  - id: RAMANUJAN-GL2
    description: "GL₂ Ramanujan bound for π (Deligne's theorem)"
    source: "Deligne (1974), Serre (1978)"
    evidence: "refereed"
    status: "[THM] for holomorphic forms"

# Core analytic ingredients
ingredients:
  - id: AFE-GL3
    description: "AFE for L(½+it, Π) with length ≈ T^{3/2} and t-dependent weights V_t"
    source: "Iwaniec–Kowalski (2004), §5.6"
    evidence: "textbook"
    status: "[THM]"

  - id: FE-FACTOR
    description: "Dual AFE factor X_Π(s) = N^{1-2s} L_∞(1-s)/L_∞(s), NOT constant root number"
    source: "Standard functional equation"
    evidence: "textbook"
    status: "[THM]"

  - id: RECIPROCAL-COEFFICIENTS
    description: "True reciprocal Euler coefficients ρ_Π(n) with (p,p²,p³) three-term structure"
    source: "Standard Euler product theory"
    evidence: "textbook"
    status: "[THM]"

  - id: GL3-TWISTED-MOMENT
    description: "Mollified twisted GL₃ moment: I(T) = C_{Π,θ}T + O(T^{1-δ}), C > 0"
    source: "Dasgupta–Leung–Young (2024), Pal (IMRN 2025)"
    evidence: "preprint / refereed"
    status: "[OBL] — research frontier; upper bounds known, not asymptotics"

  - id: CONVOLUTION-COEFFICIENTS
    description: "Bound on convolution c_X(q) = Σ_{mr=q, m≤X} b_m a_Π(r)"
    source: "Must be proved for the specific mollifier"
    evidence: "none"
    status: "[OBL]"

# What is NOT a dependency (corrected from original)
not_dependencies:
  - id: SQUAREFREE-APPROX
    description: "Squarefree approximation lemma (μ(m)=0 when p²|m → trivially zero)"
    reason: "Algebraically vacuous; the sum Σ_{p²|m} μ(m)... ≡ 0"

  - id: LRS-1995
    description: "Luo–Rudnick–Sarnak 1995 is about Selberg eigenvalue conjecture"
    reason: "Wrong attribution in original package"

  - id: GL3-LARGE-SIEVE
    description: "GL₃ spectral large sieve applies to families, NOT fixed Π"
    reason: "Wrong object; large sieve is for Σ_φ |Σ_n a_n λ_φ(n)|², not ∫|L|²"

  - id: BRIDGE-LEMMA
    description: "Bridge I(T) ≥ c₀T ⟹ L(½,Π) > 0"
    reason: "FALSE: integral at |t| ≥ T₀ cannot detect central value"
