dependencies:
  - id: GELBART-JACQUET-GL3-AFE
    statement: >
      L(s, sym^2 f) for a GL_2 cusp form f has an approximate functional
      equation expressing L(s) as a smoothed sum of A(n)/n^s with
      exponentially decaying weight.
    source: >
      Gelbart-Jacquet (1978), "A relation between automorphic representations of GL(2) and GL(3)";
      standard in the theory of automorphic L-functions.
    mathematical: REFEREED
    peer_reviewed: true
    computational: NONE
    usable_as_premise: true
    role: Provides the fundamental identity used for computation.
  - id: RAMANUJAN-DELIGNE-BOUND
    statement: >
      |tau(p)| <= 2*p^{5.5} for all primes p (Ramanujan conjecture,
      proved by Deligne).
    source: >
      Deligne (1974), "La conjecture de Weil I"; proved via etale
      cohomology.
    mathematical: REFEREED
    peer_reviewed: true
    computational: NONE
    usable_as_premise: true
    role: Gives |A(p)| <= 2 and |A(n)| <= d_3(n) for all n.
  - id: ARB-INTERVAL-ARITHMETIC
    statement: >
      The Arb library provides rigorous interval arithmetic for complex
      analysis, including Gamma function evaluation with outward rounding.
    source: >
      Fredrik Johansson (2012-), "Arb: efficient arbitrary-precision
      midpoint-radius interval arithmetic"; implemented in python-flint.
    mathematical: REFEREED
    peer_reviewed: true
    computational: VERIFIED
    usable_as_premise: true
    role: Provides the computational framework for certified evaluation.
  - id: DISCOVERY-ZERO-FREE-SCAN
    statement: >
      Empirical scan shows |L(s)| >= 0.127 for sigma in [0.6, 1.0],
      |t| <= 20, via smoothed sum with X = 4000 and N = 20000.
    source: >
